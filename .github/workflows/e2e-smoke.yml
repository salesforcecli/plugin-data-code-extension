name: e2e-smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.os }}, sdk ${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Oldest supported SDK release, and whatever is newest on PyPI.
        sdk: ['7.0.0', 'latest']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python SDK
        shell: bash
        env:
          SDK_VERSION: ${{ matrix.sdk }}
        run: |
          if [ "$SDK_VERSION" = "latest" ]; then
            python -m pip install --upgrade salesforce-data-customcode
          else
            python -m pip install "salesforce-data-customcode==$SDK_VERSION"
          fi
          # `scan` shells out to pipreqs, which the SDK does not install.
          python -m pip install pipreqs
          python -m pip show salesforce-data-customcode

      - run: yarn install --frozen-lockfile

      - run: yarn test:e2e
